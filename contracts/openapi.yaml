openapi: 3.1.0
info:
  title: Chifa Sipán API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api/v1
paths:
  /auth/login:
    post:
      summary: Login por rol
      description: Emite un token de acceso breve. El refresh se entrega como cookie HttpOnly para clientes web; los clientes móviles deben enviar X-Client-Type: mobile.
      parameters:
        - in: header
          name: X-Client-Type
          required: false
          schema: { type: string, enum: [mobile] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, context]
              properties:
                username: { type: string }
                password: { type: string }
                context: { enum: [ADMINISTRADOR, CAJERO, MESERO, COCINERO] }
      responses:
        '200': { description: Token de acceso emitido }
        '401': { description: Credenciales inválidas }
        '403': { description: Perfil no autorizado }
        '429': { description: Límite de intentos excedido }
  /auth/refresh:
    post:
      summary: Rotar refresh token y emitir un token de acceso
      description: Los clientes web usan la cookie HttpOnly; los clientes móviles envían refresh_token en el cuerpo y X-Client-Type: mobile.
      parameters:
        - in: header
          name: X-Client-Type
          required: false
          schema: { type: string, enum: [mobile] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, maxLength: 120 }
      responses:
        '200': { description: Sesión rotada }
        '401': { description: Refresh inválido, expirado o reutilizado }
        '429': { description: Límite de intentos excedido }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      summary: Revocar la sesión actual
      responses:
        '200': { description: Sesión revocada y cookie eliminada }
        '401': { description: Token de acceso inválido }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Usuario actual }
  /salon/mesas:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: vw_estado_salon_tiempo_real }
  /catalogo/productos:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Carta activa }
  /pedidos:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Listado }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea pedido y primera ronda (sp_registrar_ronda_pedido)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, tipo, items]
              properties:
                client_request_id: { type: string, format: uuid }
                tipo: { enum: [SALON, LLEVAR, DELIVERY] }
                id_pedido: { type: integer, minimum: 1, description: Pedido existente para una ronda adicional }
                id_mesa: { type: integer, minimum: 1, description: Requerido para SALON }
                id_cliente: { type: integer, minimum: 1, description: Requerido para DELIVERY }
                id_direccion_entrega: { type: integer, minimum: 1, description: Requerido para DELIVERY }
                num_comensales: { type: integer, minimum: 1 }
                notas_generales: { type: string, maxLength: 2000 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id_producto, cantidad, prioridad]
                    properties:
                      id_producto: { type: string }
                      id_variante: { type: integer, minimum: 1 }
                      cantidad: { type: integer, minimum: 1 }
                      prioridad: { type: string, maxLength: 12 }
                      nota: { type: string, maxLength: 250 }
                      modificadores:
                        type: array
                        items: { type: integer, minimum: 1 }
      responses:
        '201': { description: Creado }
        '409': { description: ORDER_TABLE_OCCUPIED }
        '503': { description: Solicitud idempotente en curso; reintentar con el mismo identificador }
        '422': { description: Validación fallida o catálogo inválido }
  /pedidos/items/{id}/entregado:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Marcar un ítem listo como entregado por su mesero
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Ítem entregado }
        '403': { description: Perfil no autorizado }
        '404': { description: Ítem no encontrado }
        '409': { description: Estado de ítem incompatible }
  /cocina/cola:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: vw_cola_cocina_activa }
  /caja/sesiones/actual:
    get:
      security: [{ bearerAuth: [] }]
      summary: Consultar la sesión de caja abierta
      responses:
        '200': { description: Sesión actual o null si está cerrada }
  /caja/sesiones:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto_apertura]
              properties:
                monto_apertura: { type: number, minimum: 0 }
                observaciones: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Caja abierta }
        '409': { description: Ya existe una sesión abierta }
  /caja/sesiones/{id}/cierre:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto_declarado]
              properties:
                monto_declarado: { type: number, minimum: 0 }
                observaciones: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Sesión cerrada y arqueada }
        '403': { description: Perfil no autorizado }
        '409': { description: Sesión cerrada, inexistente o de otro usuario }
  /comprobantes:
    post:
      security: [{ bearerAuth: [] }]
      summary: Emitir un comprobante idempotente para un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_pedido, receipt_request_id, tipo]
              properties:
                id_pedido: { type: integer, minimum: 1 }
                receipt_request_id: { type: string, format: uuid }
                id_cliente: { type: integer, minimum: 1 }
                tipo: { enum: [BOLETA, FACTURA, NOTA_VENTA, NOTA_CREDITO] }
      responses:
        '201': { description: Comprobante emitido }
        '200': { description: Reintento idempotente del mismo comprobante }
        '409': { description: Pedido ya facturado o no facturable }
        '422': { description: Validación fallida; NOTA_CREDITO no está implementada y requiere flujo independiente }
  /pagos:
    post:
      security: [{ bearerAuth: [] }]
      summary: sp_registrar_pago_y_cerrar_cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_request_id, id_comprobante, id_caja_sesion, metodo, monto]
              properties:
                payment_request_id: { type: string, format: uuid }
                id_comprobante: { type: integer, minimum: 1 }
                id_caja_sesion: { type: integer, minimum: 1 }
                metodo: { enum: [EFECTIVO, TARJETA, YAPE, PLIN, TRANSFERENCIA] }
                monto: { type: number, exclusiveMinimum: 0 }
                monto_recibido: { type: number, minimum: 0 }
      responses:
        '201': { description: Pago registrado }
        '200': { description: Reintento idempotente del pago registrado }
        '409': { description: Sesión, pedido, saldo o identificador en conflicto }
        '503': { description: Pago idempotente en curso; reintentar con el mismo identificador }
        '422': { description: Validación fallida }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
